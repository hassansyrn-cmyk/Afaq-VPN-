name: Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
      VITE_WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
      VITE_WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
      VITE_WG_PRESHARED_KEY: ${{ secrets.WG_PRESHARED_KEY }}
      VITE_WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}

      WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
      WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
      WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
      WG_PRESHARED_KEY: ${{ secrets.WG_PRESHARED_KEY }}
      WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify WireGuard configuration
        shell: bash
        run: |
          if [ -z "$VITE_WG_CLIENT_ADDRESS" ]; then
            echo "Missing secret: WG_CLIENT_ADDRESS"
            exit 1
          fi

          if [ -z "$VITE_WG_CLIENT_PRIVATE_KEY" ]; then
            echo "Missing secret: WG_CLIENT_PRIVATE_KEY"
            exit 1
          fi

          if [ -z "$VITE_WG_ENDPOINT" ]; then
            echo "Missing secret: WG_ENDPOINT"
            exit 1
          fi

          if [ -z "$VITE_WG_PRESHARED_KEY" ]; then
            echo "Missing secret: WG_PRESHARED_KEY"
            exit 1
          fi

          if [ -z "$VITE_WG_SERVER_PUBLIC_KEY" ]; then
            echo "Missing secret: WG_SERVER_PUBLIC_KEY"
            exit 1
          fi

          echo "All WireGuard secrets are available."

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build React application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest -PAFAQ_ENABLE_LEGACY_DEBUG_FALLBACK=true --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PAFAQ_ENABLE_LEGACY_DEBUG_FALLBACK=true --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: afaq-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
