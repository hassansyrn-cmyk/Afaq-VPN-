name: Android Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
      VITE_WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
      VITE_WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
      VITE_WG_PRESHARED_KEY: ${{ secrets.WG_PRESHARED_KEY }}
      VITE_WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}

      WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
      WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
      WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
      WG_PRESHARED_KEY: ${{ secrets.WG_PRESHARED_KEY }}
      WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}

      SIGNING_STORE_FILE: "release.keystore"
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build React application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ ! -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi

      - name: Build Signed Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: afaq-vpn-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
