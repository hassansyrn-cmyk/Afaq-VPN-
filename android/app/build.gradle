apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.afaq.vpn"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    def legacyFallback = project.hasProperty('AFAQ_ENABLE_LEGACY_DEBUG_FALLBACK') ? project.property('AFAQ_ENABLE_LEGACY_DEBUG_FALLBACK').toBoolean() : false

    defaultConfig {
        applicationId "com.afaq.vpn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "boolean", "ENABLE_LEGACY_DEBUG_FALLBACK", "${legacyFallback}"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        release {
            def keystoreFile = System.getenv("SIGNING_STORE_FILE") ? file(System.getenv("SIGNING_STORE_FILE")) : file("release.keystore")
            storeFile keystoreFile
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "afaq"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

task checkReleaseSecurity {
    doLast {
        def legacyFallback = project.hasProperty('AFAQ_ENABLE_LEGACY_DEBUG_FALLBACK') ? project.property('AFAQ_ENABLE_LEGACY_DEBUG_FALLBACK').toBoolean() : false
        if (legacyFallback) {
            throw new GradleException("Security violation: AFAQ_ENABLE_LEGACY_DEBUG_FALLBACK is enabled.")
        }

        def manifestFile = file('src/main/AndroidManifest.xml')
        if (manifestFile.exists()) {
            def manifestText = manifestFile.text
            if (manifestText.contains('usesCleartextTraffic="true"')) {
                throw new GradleException("Security violation: usesCleartextTraffic is set to true in AndroidManifest.xml.")
            }
        }

        def webAssetsDir = file('src/main/assets/public')
        if (webAssetsDir.exists()) {
            webAssetsDir.eachFileRecurse { f ->
                if (f.isFile() && f.name.endsWith('.js')) {
                    def content = f.text
                    if (content.contains("AFAQ_API_TOKEN")) {
                        throw new GradleException("Security violation: Static backend API token found in web assets!")
                    }
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("assembleRelease") || task.name.startsWith("bundleRelease")) {
        task.dependsOn(checkReleaseSecurity)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.wireguard.android:tunnel:1.0.20260102"
    implementation "com.google.android.play:integrity:1.4.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
